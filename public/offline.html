<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070706" />
    <title>37 Music Studio Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #070706;
        color: #fffaf0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 22px;
        background:
          radial-gradient(circle at 16% 0%, rgba(239,197,110,.11), transparent 34rem),
          radial-gradient(circle at 90% 10%, rgba(88,224,233,.07), transparent 30rem),
          linear-gradient(180deg, #070706 0%, #0c0d10 100%);
      }

      main {
        width: min(440px, 100%);
        padding: 22px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 28px;
        background:
          linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.014)),
          rgba(16,19,28,.88);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.08),
          0 30px 90px rgba(0,0,0,.42);
      }

      .mark {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        margin-bottom: 18px;
        border-radius: 20px;
        color: #130f08;
        background:
          radial-gradient(circle at 50% 0%, rgba(255,255,255,.34), transparent 58%),
          linear-gradient(135deg, #efc56e, #d49a3e);
        font-weight: 900;
        letter-spacing: -.04em;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 10vw, 3.2rem);
        line-height: .92;
        letter-spacing: -.06em;
      }

      p {
        margin: 12px 0 0;
        color: rgba(255,250,240,.72);
        line-height: 1.55;
      }

      button {
        min-height: 44px;
        margin-top: 18px;
        padding: 0 16px;
        border: 0;
        border-radius: 999px;
        color: #130f08;
        background:
          radial-gradient(circle at 50% 0%, rgba(255,255,255,.30), transparent 58%),
          linear-gradient(135deg, #efc56e, #d49a3e);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">37</div>
      <h1>Kamu sedang offline.</h1>
      <p>
        Beberapa halaman 37 Music Studio sudah tersimpan di cache PWA, tapi koneksi dibutuhkan
        untuk sinkronisasi booking, pesan client, dan data terbaru.
      </p>
      <button type="button" onclick="location.reload()">Coba muat ulang</button>
    </main>
  </body>
</html>
